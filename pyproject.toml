[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pram"
version = "1.0.0"
description = "Partwise Reasoning across Modalities with frozen representations"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "PRAM Authors"}]
dependencies = ["torch>=2.0", "numpy>=1.24", "huggingface_hub>=0.23"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/Luo1Yan/PRAM"

[tool.setuptools]
packages = ["pram", "data", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
